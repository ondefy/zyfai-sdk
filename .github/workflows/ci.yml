name: CI

on:
  pull_request:

concurrency:
  group: sdk-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - run: npm run build
      - if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: bash .github/scripts/require-changeset.sh
